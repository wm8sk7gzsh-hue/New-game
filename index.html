  function drawLeaderboard() {
    ctx.fillStyle = 'rgba(5,3,20,0.85)';
    ctx.fillRect(0, 0, CFG.width, CFG.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 34px "Segoe UI", sans-serif';
    ctx.shadowColor = 'rgba(255,180,80,0.6)';
    ctx.shadowBlur = 18;
    ctx.fillText('🏆 ТАБЛИЦА РЕКОРДОВ', CFG.width / 2, 80);
    ctx.shadowBlur = 0;

    ctx.textAlign = 'left';
    ctx.font = 'bold 15px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('#', 60, 130);
    ctx.fillText('ОЧКИ', 110, 130);
    ctx.fillText('ДАТА', 230, 130);
    ctx.textAlign = 'start';

    ctx.strokeStyle = 'rgba(150,120,255,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(50, 145);
    ctx.lineTo(CFG.width - 50, 145);
    ctx.stroke();

    const top = Storage.getTopScores(10);
    if (top.length === 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = 'italic 18px "Segoe UI", sans-serif';
      ctx.fillText('Пока нет рекордов 😢', CFG.width / 2, 350);
      ctx.fillText('Сыграй первую игру!', CFG.width / 2, 385);
      ctx.textAlign = 'start';
    } else {
      const medals = ['🥇', '🥈', '🥉'];
      const rowH = 42, startY = 175;
      for (let i = 0; i < top.length; i++) {
        const item = top[i];
        const y = startY + i * rowH;
        if (i === 0) { ctx.fillStyle = 'rgba(255,215,0,0.15)'; ctx.fillRect(50, y - 24, CFG.width - 100, 34); }
        else if (i === 1) { ctx.fillStyle = 'rgba(192,192,192,0.1)'; ctx.fillRect(50, y - 24, CFG.width - 100, 34); }
        else if (i === 2) { ctx.fillStyle = 'rgba(205,127,50,0.1)'; ctx.fillRect(50, y - 24, CFG.width - 100, 34); }

        ctx.textAlign = 'left';
        ctx.font = 'bold 18px "Segoe UI", sans-serif';
        if (i < 3) { ctx.fillStyle = '#fff'; ctx.fillText(medals[i], 60, y); }
        else { ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillText(`${i + 1}`, 68, y); }

        ctx.fillStyle = '#ffe066';
        ctx.font = 'bold 20px "Segoe UI", sans-serif';
        ctx.fillText(`${item.score}`, 110, y);

        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '14px "Segoe UI", sans-serif';
        ctx.fillText(formatDate(item.date), 230, y);
      }
    }

    const bw = 220, bh = 56, bx = (CFG.width - bw) / 2, by = CFG.height - 100;
    currentButtons = [makeButton(bx, by, bw, bh, '← НАЗАД', () => goToMainMenu(), false)];
  }

  function drawAttempts() {
    ctx.fillStyle = 'rgba(5,3,20,0.85)';
    ctx.fillRect(0, 0, CFG.width, CFG.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7ad7ff';
    ctx.font = 'bold 34px "Segoe UI", sans-serif';
    ctx.shadowColor = 'rgba(120,200,255,0.6)';
    ctx.shadowBlur = 18;
    ctx.fillText('📊 МОИ ПОПЫТКИ', CFG.width / 2, 80);
    ctx.shadowBlur = 0;

    const history = Storage.getHistory();
    const recent = Storage.getRecentAttempts(8);

    if (history.length > 0) {
      const scores = history.map(h => h.score);
      const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
      const best = Math.max(...scores);
      ctx.textAlign = 'center';
      ctx.font = '14px "Segoe UI", sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText(`Всего игр: ${history.length}    Средний: ${avg}    Лучший: ${best}`, CFG.width / 2, 118);
      ctx.textAlign = 'start';
    }

    ctx.strokeStyle = 'rgba(120,200,255,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(50, 140);
    ctx.lineTo(CFG.width - 50, 140);
    ctx.stroke();

    if (recent.length === 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = 'italic 18px "Segoe UI", sans-serif';
      ctx.fillText('Ты ещё не играл 😴', CFG.width / 2, 350);
      ctx.fillText('Нажми "Играть" в меню!', CFG.width / 2, 385);
      ctx.textAlign = 'start';
    } else {
      const rowH = 44, startY = 175;
      for (let i = 0; i < recent.length; i++) {
        const item = recent[i];
        const y = startY + i * rowH;
        const isPersonalBest = item.score === Storage.getBest();

        ctx.fillStyle = i % 2 === 0 ? 'rgba(120,200,255,0.06)' : 'rgba(120,200,255,0.02)';
        ctx.fillRect(50, y - 24, CFG.width - 100, 36);

        ctx.textAlign = 'left';
        ctx.font = 'bold 15px "Segoe UI", sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText(`#${recent.length - i}`, 65, y);

        ctx.fillStyle = isPersonalBest ? '#ffe066' : '#fff';
        ctx.font = 'bold 20px "Segoe UI", sans-serif';
        ctx.fillText(`${item.score}`, 130, y);

        if (isPersonalBest) {
          ctx.font = 'bold 12px "Segoe UI", sans-serif';
          ctx.fillStyle = '#ffb800';
          ctx.fillText('★ РЕКОРД', 180, y);
        }

        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '13px "Segoe UI", sans-serif';
        ctx.fillText(formatDate(item.date), 290, y);
      }
    }

    const bw = 220, bh = 56, bx = (CFG.width - bw) / 2, by = CFG.height - 100;
    currentButtons = [makeButton(bx, by, bw, bh, '← НАЗАД', () => goToMainMenu(), false)];
  }

  function drawSkins() {
    ctx.fillStyle = 'rgba(5,3,20,0.92)';
    ctx.fillRect(0, 0, CFG.width, CFG.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffb8ff';
    ctx.font = 'bold 30px "Segoe UI", sans-serif';
    ctx.shadowColor = 'rgba(255,120,255,0.6)';
    ctx.shadowBlur = 18;
    ctx.fillText('🎨 СКИНЫ КОРАБЛЯ', CFG.width / 2, 42);
    ctx.shadowBlur = 0;

    const best = Storage.getBest();
    const unlocked = Storage.getUnlockedSkins();
    const selected = Storage.getSelectedSkin();

    ctx.font = '12px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText(`Открыто: ${unlocked.length} / ${SKINS.length}    Рекорд: ${best}`, CFG.width / 2, 64);
    ctx.textAlign = 'start';

    ctx.strokeStyle = 'rgba(255,180,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(30, 78);
    ctx.lineTo(CFG.width - 30, 78);
    ctx.stroke();

    const cols = 2;
    const cardW = 210, cardH = 96;
    const gapX = 10, gapY = 8;
    const startX = (CFG.width - (cols * cardW + (cols - 1) * gapX)) / 2;
    const startY = 90;

    const clickableRects = [];

    for (let i = 0; i < SKINS.length; i++) {
      const skin = SKINS[i];
      const col = i % cols;
      const row = Math.floor(i / cols);
      const cx = startX + col * (cardW + gapX);
      const cy = startY + row * (cardH + gapY);

      const isUnlocked = unlocked.includes(skin.id);
      const isSelected = selected === skin.id;
      const rarity = RARITY[skin.rarity];

      const bgGrad = ctx.createLinearGradient(cx, cy, cx, cy + cardH);
      if (isSelected) {
        bgGrad.addColorStop(0, 'rgba(120,255,160,0.28)');
        bgGrad.addColorStop(1, 'rgba(60,180,100,0.15)');
      } else if (isUnlocked) {
        bgGrad.addColorStop(0, 'rgba(60,40,120,0.55)');
        bgGrad.addColorStop(1, 'rgba(20,10,50,0.55)');
      } else {
        bgGrad.addColorStop(0, 'rgba(20,20,40,0.7)');
        bgGrad.addColorStop(1, 'rgba(10,10,20,0.7)');
      }
      ctx.fillStyle = bgGrad;
      roundRect(ctx, cx, cy, cardW, cardH, 10);
      ctx.fill();

      ctx.strokeStyle = isSelected ? 'rgba(120,255,160,0.95)' :
        isUnlocked ? rarity.color : 'rgba(70,70,80,0.7)';
      ctx.lineWidth = isSelected ? 2.5 : (isUnlocked ? 2 : 1);
      ctx.shadowColor = isUnlocked && !isSelected ? rarity.glow : 'transparent';
      ctx.shadowBlur = isUnlocked && !isSelected ? 8 : 0;
      roundRect(ctx, cx, cy, cardW, cardH, 10);
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.save();
      if (isUnlocked) drawShipPreview(cx + 52, cy + cardH / 2, 0.62, skin);
      else drawShipSilhouette(cx + 52, cy + cardH / 2, 0.62);
      ctx.restore();

      ctx.textAlign = 'left';
      ctx.font = 'bold 14px "Segoe UI", sans-serif';
      ctx.fillStyle = isUnlocked ? '#fff' : 'rgba(255,255,255,0.45)';
      ctx.fillText(isUnlocked ? skin.name : '? ? ?', cx + 100, cy + 22);

      ctx.font = 'bold 10px "Segoe UI", sans-serif';
      ctx.fillStyle = isUnlocked ? rarity.color : 'rgba(150,150,160,0.6)';
      ctx.fillText(rarity.name.toUpperCase(), cx + 100, cy + 38);

      if (isSelected) {
        ctx.fillStyle = '#7affa0';
        ctx.font = 'bold 11px "Segoe UI", sans-serif';
        ctx.fillText('✓ ВЫБРАН', cx + 100, cy + 56);
      } else if (isUnlocked) {
        ctx.fillStyle = 'rgba(255,200,255,0.8)';
        ctx.font = '10px "Segoe UI", sans-serif';
        ctx.fillText('Нажми чтобы выбрать', cx + 100, cy + 56);
      } else {
        const unlockZone = ZONES[skin.unlockZone];
        ctx.fillStyle = 'rgba(255,180,180,0.85)';
        ctx.font = 'bold 10px "Segoe UI", sans-serif';
        ctx.fillText(`🔒 ${unlockZone.name}`, cx + 100, cy + 56);

        const prevScore = skin.unlockZone > 0 ? ZONES[skin.unlockZone - 1].unlockScore + CFG.zoneSize : 0;
        const targetScore = skin.unlockScore;
        const prog = clamp((best - prevScore) / (targetScore - prevScore), 0, 1);

        const barW = 100;
        const barX = cx + 100;
        const barY = cy + 70;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        roundRect(ctx, barX, barY, barW, 5, 2.5);
        ctx.fill();
        ctx.fillStyle = rarity.color;
        roundRect(ctx, barX, barY, barW * prog, 5, 2.5);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '9px "Segoe UI", sans-serif';
        ctx.fillText(`${best} / ${targetScore}`, barX + barW + 4, barY + 5);
      }
      ctx.textAlign = 'start';

      if (isUnlocked && !isSelected) {
        clickableRects.push({
          x: cx, y: cy, w: cardW, h: cardH,
          action: () => { Storage.setSelectedSkin(skin.id); Sound.power(); },
        });
      }
    }

    currentButtons = clickableRects.map(r => makeButton(r.x, r.y, r.w, r.h, '', r.action, false));
    const bw = 220, bh = 52, bx = (CFG.width - bw) / 2, by = CFG.height - 70;
    currentButtons.push(makeButton(bx, by, bw, bh, '← НАЗАД', () => goToMainMenu(), false));
  }

  function drawShipSilhouette(cx, cy, scale) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.rotate(-0.15);
    const R = CFG.birdRadius;

    ctx.fillStyle = 'rgba(30,30,45,0.95)';
    ctx.beginPath();
    ctx.moveTo(R + 8, 0);
    ctx.quadraticCurveTo(R - 2, -R * 0.9, -R + 2, -R * 0.7);
    ctx.lineTo(-R - 3, -R * 0.5);
    ctx.lineTo(-R - 3, R * 0.5);
    ctx.lineTo(-R + 2, R * 0.7);
    ctx.quadraticCurveTo(R - 2, R * 0.9, R + 8, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(255,200,120,0.75)';
    ctx.strokeStyle = 'rgba(255,200,120,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -3, 4, Math.PI, 0);
    ctx.stroke();
    ctx.fillRect(-5, -1, 10, 8);

    ctx.restore();
  }

  function drawShipPreview(cx, cy, scale, skin) {
    const c = skin.colors;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.rotate(-0.15);
    const R = CFG.birdRadius;

    const flicker = 0.7 + Math.sin(game.time * 40) * 0.3;
    const exLen = 18 * flicker + 4;
    const exhaustGrad = ctx.createLinearGradient(-R - 3, 0, -R - exLen, 0);
    exhaustGrad.addColorStop(0, c.exhaust1);
    exhaustGrad.addColorStop(0.3, c.exhaust2);
    exhaustGrad.addColorStop(0.7, c.exhaust3);
    exhaustGrad.addColorStop(1, c.exhaust4);
    ctx.fillStyle = exhaustGrad;
    ctx.beginPath();
    ctx.moveTo(-R - 2, -4);
    ctx.lineTo(-R - exLen, 0);
    ctx.lineTo(-R - 2, 4);
    ctx.closePath();
    ctx.fill();

    const bodyGrad = ctx.createLinearGradient(0, -R, 0, R);
    bodyGrad.addColorStop(0, c.hullTop);
    bodyGrad.addColorStop(0.35, c.hullMid);
    bodyGrad.addColorStop(0.6, c.hullLow);
    bodyGrad.addColorStop(1, c.hullBot);
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(R + 8, 0);
    ctx.quadraticCurveTo(R - 2, -R * 0.9, -R + 2, -R * 0.7);
    ctx.lineTo(-R - 3, -R * 0.5);
    ctx.lineTo(-R - 3, R * 0.5);
    ctx.lineTo(-R + 2, R * 0.7);
    ctx.quadraticCurveTo(R - 2, R * 0.9, R + 8, 0);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = c.stroke;
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.fillStyle = c.wing;
    ctx.beginPath();
    ctx.moveTo(-R + 3, -R * 0.55);
    ctx.lineTo(2, -R - 4);
    ctx.lineTo(R - 2, -R * 0.4);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-R + 3, R * 0.55);
    ctx.lineTo(2, R + 4);
    ctx.lineTo(R - 2, R * 0.4);
    ctx.closePath();
    ctx.fill();

    const cockpitGrad = ctx.createRadialGradient(-1, -R * 0.35 - 1, 0, 2, -R * 0.35, 4);
    cockpitGrad.addColorStop(0, c.cockpit1);
    cockpitGrad.addColorStop(0.5, c.cockpit2);
    cockpitGrad.addColorStop(1, c.cockpit3);
    ctx.fillStyle = cockpitGrad;
    ctx.beginPath();
    ctx.arc(2, -R * 0.35, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = c.light;
    ctx.beginPath();
    ctx.arc(R + 6, 0, 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(10,3,20,0.7)';
    ctx.fillRect(0, 0, CFG.width, CFG.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff5c5c';
    ctx.font = 'bold 44px "Segoe UI", sans-serif';
    ctx.shadowColor = 'rgba(255,90,90,0.7)';
    ctx.shadowBlur = 22;
    ctx.fillText('КОРАБЛЬ УНИЧТОЖЕН', CFG.width / 2, 200);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px "Segoe UI", sans-serif';
    ctx.fillText(`Очки: ${game.score}`, CFG.width / 2, 280);

    const reachedZone = ZONES[game.currentZone];
    ctx.fillStyle = `hsl(${reachedZone.hue}, 80%, 75%)`;
    ctx.font = 'bold 18px "Segoe UI", sans-serif';
    ctx.shadowColor = `hsla(${reachedZone.hue}, 80%, 60%, 0.7)`;
    ctx.shadowBlur = 12;
    ctx.fillText(`📍 ${reachedZone.name}`, CFG.width / 2, 315);
    ctx.shadowBlur = 0;

    const isNewRecord = game.score >= Storage.getBest() && game.score > 0;
    ctx.fillStyle = isNewRecord ? '#ffe066' : '#c8c8c8';
    ctx.font = 'bold 20px "Segoe UI", sans-serif';
    if (isNewRecord) {
      ctx.shadowColor = 'rgba(255,200,80,0.8)';
      ctx.shadowBlur = 20;
      ctx.fillText('🎉 НОВЫЙ РЕКОРД!', CFG.width / 2, 355);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillText(`🥇 Рекорд: ${game.best}`, CFG.width / 2, 355);
    }

    const bw = 260, bh = 58, bx = (CFG.width - bw) / 2;
    if (game.deadTimer > 0.5) {
      const gap = 72, startY = 420;
      currentButtons = [
        makeButton(bx, startY + gap * 0, bw, bh, '🔄  НОВЫЙ ЗАПУСК', () => startGame(),     true),
        makeButton(bx, startY + gap * 1, bw, bh, '🏠  В МЕНЮ',       () => goToMainMenu(), false),
      ];
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.font = '13px "Segoe UI", sans-serif';
      ctx.fillText('или нажми ПРОБЕЛ', CFG.width / 2, CFG.height - 40);
    } else {
      currentButtons = [];
    }
    ctx.textAlign = 'start';
  }

  function drawExitScreen() {
    ctx.fillStyle = 'rgba(2,1,10,0.9)';
    ctx.fillRect(0, 0, CFG.width, CFG.height);
    ctx.textAlign = 'center';
    const g = ctx.createLinearGradient(0, 250, 0, 350);
    g.addColorStop(0, '#ffe066');
    g.addColorStop(0.5, '#ff8ac4');
    g.addColorStop(1, '#9b6bff');
    ctx.fillStyle = g;
    ctx.font = 'bold 44px "Segoe UI", sans-serif';
    ctx.shadowColor = 'rgba(255,150,220,0.7)';
    ctx.shadowBlur = 24;
    ctx.fillText('ДО ВСТРЕЧИ!', CFG.width / 2, 300);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '16px "Segoe UI", sans-serif';
    ctx.fillText('Спасибо за игру ✨', CFG.width / 2, 360);
    ctx.fillText('Закрой вкладку, если она не закрылась сама', CFG.width / 2, 395);

    const bw = 260, bh = 58, bx = (CFG.width - bw) / 2, by = 470;
    currentButtons = [makeButton(bx, by, bw, bh, '🏠  В МЕНЮ', () => goToMainMenu(), true)];
    ctx.textAlign = 'start';
  }

  // ============ ГЛАВНЫЙ ЦИКЛ ============
  function loop(now) {
    const dt = Math.min(50, now - lastTime);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ============ ВВОД ============
  let lastInputTime = 0, lastTap = 0;

  function getCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) / rect.width * CFG.width,
      y: (clientY - rect.top) / rect.height * CFG.height,
    };
  }

  function handlePointerDown(clientX, clientY) {
    const { x, y } = getCanvasCoords(clientX, clientY);
    for (const btn of currentButtons) {
      if (isInside(btn, x, y)) {
        Sound.click();
        btn.action();
        return true;
      }
    }
    return false;
  }

  function handleInput(e, clientX, clientY) {
    if (e) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
    }
    const now = performance.now();
    if (now - lastInputTime < CFG.inputThrottle) return;
    lastInputTime = now;

    const consumed = handlePointerDown(clientX, clientY);
    if (consumed) return;

    if (screen === Screen.PLAY) flap();
  }

  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    handleInput(e, t.clientX, t.clientY);
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    handleInput(e, e.clientX, e.clientY);
  });

  canvas.addEventListener('mousemove', (e) => {
    const { x, y } = getCanvasCoords(e.clientX, e.clientY);
    for (const btn of currentButtons) {
      btn.hover = isInside(btn, x, y);
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
      e.preventDefault();
      const now = performance.now();
      if (now - lastInputTime < CFG.inputThrottle) return;
      lastInputTime = now;

      if (screen === Screen.PLAY) flap();
      else if (screen === Screen.MAIN_MENU) startGame();
      else if (screen === Screen.DEAD) {
        if (game.deadTimer > 0.5 && (e.code === 'Space' || e.code === 'Enter')) startGame();
      } else if (screen === Screen.LEADERBOARD || screen === Screen.ATTEMPTS || screen === Screen.EXIT || screen === Screen.SKINS) {
        if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape') goToMainMenu();
      }
    }
    if (e.code === 'Escape') {
      e.preventDefault();
      if (screen !== Screen.MAIN_MENU) goToMainMenu();
    }
  });

  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTap < 300) {
      if (e.cancelable) e.preventDefault();
    }
    lastTap = now;
  }, { passive: false });

  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('gesturechange', (e) => e.preventDefault());
  document.addEventListener('gestureend', (e) => e.preventDefault());
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  window.addEventListener('wheel', (e) => {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });

  // ============ СТАРТ ============
  requestAnimationFrame(loop);
})();
</script>
